<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amelia Recall Coder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: workbench — slim header, queue rail on the left, one response at a time on the right. Acts carry a fixed color everywhere. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunk:#eceee9; --ink:#1c2220; --muted:#5d6762; --line:#d8dcd5;
  --accent:#2c5a4e; --accent-ink:#ffffff; --accent-soft:#dce9e3; --warn:#9a5b00; --warn-soft:#f6ead6; --bad:#a3352b; --bad-soft:#f6dfdb; --good:#2f6f4a; --good-soft:#dcefe2;
  --a1:#9a6200; --a2:#8a3f86; --a3:#2a619a; --a4:#a3402f; --a5:#2f7451; --a6:#5b5b98; --aN:#6b6f6c; --aU:#6b6f6c;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161a19; --surface:#1e2321; --sunk:#141716; --ink:#e4e8e5; --muted:#9aa49f; --line:#323935;
  --accent:#7fc0ad; --accent-ink:#0e1513; --accent-soft:#233a33; --warn:#e2ad5c; --warn-soft:#3a2f1d; --bad:#ec8a7e; --bad-soft:#3d2421; --good:#86cfa1; --good-soft:#1f3527;
  --a1:#e0a948; --a2:#d08bcb; --a3:#7fb0e6; --a4:#ea8c7a; --a5:#7fcca2; --a6:#a6a6e6; --aN:#9aa09c; --aU:#9aa09c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161a19; --surface:#1e2321; --sunk:#141716; --ink:#e4e8e5; --muted:#9aa49f; --line:#323935;
  --accent:#7fc0ad; --accent-ink:#0e1513; --accent-soft:#233a33; --warn:#e2ad5c; --warn-soft:#3a2f1d; --bad:#ec8a7e; --bad-soft:#3d2421; --good:#86cfa1; --good-soft:#1f3527;
  --a1:#e0a948; --a2:#d08bcb; --a3:#7fb0e6; --a4:#ea8c7a; --a5:#7fcca2; --a6:#a6a6e6; --aN:#9aa09c; --aU:#9aa09c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
.login{max-width:480px;margin:32px auto;display:grid;gap:12px}
.login .field input{font-size:15px}
.err{color:var(--bad);font-size:13px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-inline:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ini{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.ini input{width:64px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-transform:uppercase;font-family:var(--f-mono)}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:var(--r)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
#banner:empty{display:none}
.banner{margin:12px 16px 0;padding:8px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
main{padding-block:16px 48px;padding-inline:16px}
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.shell.withkey{grid-template-columns:minmax(0,1fr) minmax(300px,370px)}
#app{min-width:0}
#sidekey{position:sticky;top:calc(var(--hh,72px) + 12px);max-height:calc(100vh - var(--hh,72px) - 28px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.skhead{position:sticky;top:0;z-index:1;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.skhead .row{justify-content:space-between}
.skhead h2{font-family:var(--f-display);font-size:16px;margin:0}
.skhead input{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 8px}
.sktabs{margin:0}
.sktabs button{padding:4px 8px;font-size:13px}
.guide{font-size:13.5px;line-height:1.5;padding-top:8px}
.guide .glead{margin:0 0 6px}
.guide h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px}
.guide ul{margin:0;padding-left:18px;display:grid;gap:7px}
.gex{margin-top:4px;font-family:var(--f-display);font-size:14px;background:var(--sunk);border-radius:4px;padding:5px 8px}
.gcut{color:var(--accent);font-family:var(--f-body);font-weight:600;padding:0 2px}
.skchips{display:flex;flex-wrap:wrap;gap:4px}
.kc{border:1px solid var(--line);background:transparent;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--c,var(--muted))}
.kc[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--surface);font-weight:600}
.sknote{font-size:12px;color:var(--muted)}
.sklist{padding:4px 12px 12px}
.skact{display:flex;gap:8px;align-items:center;margin:12px 0 4px;font-size:12px;color:var(--muted)}
.ski{display:grid;grid-template-columns:2.6em minmax(0,1fr);gap:6px;padding:6px 6px 6px 4px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.ski.on{border-left-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.ski .iut{font-size:14px}
.ski .iualt{font-size:13px}
.shell.withkey .up{grid-template-columns:minmax(0,1fr)}
.shell.withkey .ul2{display:flex;flex-wrap:wrap;gap:4px;max-height:none}
.shell.withkey .ub{grid-template-columns:auto auto;padding:3px 9px;gap:4px}
.shell.withkey .ub .t{display:none}
@media (max-width:1180px){.shell.withkey .wb{grid-template-columns:minmax(0,1fr)}
  .shell.withkey .rail{display:flex;overflow-x:auto}
  .shell.withkey .rail h2{border-bottom:0;white-space:nowrap;align-self:center}
  .shell.withkey .qi{width:auto;border-bottom:0;border-left:1px solid var(--line);flex:none}
  .shell.withkey .qi .pid{overflow:visible}}
@media (max-width:820px){.shell.withkey{grid-template-columns:minmax(0,1fr)}#sidekey{position:static;max-height:none}}
.popout .top .seg,.popout .ini,.popout #keyBtn,.popout #lockBtn,.popout #banner,.popout #app{display:none!important}
.popout .shell{grid-template-columns:minmax(0,1fr)}
.popout #sidekey{position:static;max-height:none;border:0;max-width:760px;margin:0 auto;width:100%}
.wb{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.wb{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rail h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.qi{display:flex;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 12px;gap:8px;align-items:center}
.qi:last-child{border-bottom:0}
.qi[aria-current="true"]{background:var(--accent-soft)}
.qi .pid{font-family:var(--f-mono);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.mid{background:var(--warn-soft);color:var(--warn)}
.chip.on{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px}
.ph h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0}
.meta{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.steps span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.steps span.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;max-width:72ch}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--sunk)}
.empty{color:var(--muted);padding:32px 8px;text-align:center}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
/* Response text */
.resp{font-family:var(--f-display);font-size:16.5px;line-height:1.75;background:var(--sunk);border-radius:var(--r);padding:14px 16px;margin:0 0 14px}
.w{cursor:pointer;border-radius:3px;padding:1px 1px}
.w:hover{background:var(--accent-soft)}
.useg{border-radius:3px;padding:2px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.useg.alt{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.w.end::after{content:"‖";color:var(--accent);font-family:var(--f-body);font-weight:600;margin:0 4px 0 3px}
.locked .w{cursor:default}
.locked .w:hover{background:inherit}
.usup{font-family:var(--f-mono);font-size:10px;color:var(--accent);vertical-align:super;margin-right:2px}
.ulist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ulist li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:8px;padding:6px 8px;border-left:3px solid var(--line);background:var(--surface)}
.num{font-family:var(--f-mono);color:var(--muted);font-size:12px;padding-top:2px;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.bar .grow{margin-left:auto}
/* Act pass */
.arow{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:4px 10px;padding:10px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;background:var(--surface);border-left-width:4px}
.arow.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.arow .utext{margin:0;font-family:var(--f-display);font-size:15.5px}
.actbtns{grid-column:2;display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ab{border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:3px 10px;font-size:13px;min-width:34px}
.ab:hover{border-color:var(--c)}
.ab[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface);font-weight:600}
.c1{--c:var(--a1)}.c2{--c:var(--a2)}.c3{--c:var(--a3)}.c4{--c:var(--a4)}.c5{--c:var(--a5)}.c6{--c:var(--a6)}.cN{--c:var(--aN)}.cU{--c:var(--aU)}
.bl{border-left-color:var(--c,var(--line))}
.actchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 8px;white-space:nowrap}
/* Unit pass */
.up{display:grid;grid-template-columns:minmax(180px,250px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.up{grid-template-columns:minmax(0,1fr)}}
.ul2{display:grid;gap:4px;max-height:70vh;overflow:auto}
.ub{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:6px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c,var(--line));background:var(--surface);border-radius:var(--r);padding:6px 8px;font-size:13px;align-items:start}
.ub[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ub .t{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;border-top:4px solid var(--c,var(--line));min-width:0}
.card .big{font-family:var(--f-display);font-size:18px;line-height:1.5;margin:6px 0 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:5px 8px}
.ius{display:grid;gap:4px;margin:12px 0;max-height:52vh;overflow:auto;padding-right:4px}
.iu{display:grid;grid-template-columns:auto 2.6em minmax(0,1fr);gap:4px 8px;align-items:start;padding:7px 8px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.iu:hover{border-color:var(--muted)}
.iu.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.iu input{margin-top:3px}
.iun{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.iul{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.iut{font-family:var(--f-display);font-size:14.5px;display:block}
.iualt{display:block;font-family:var(--f-display);font-style:italic;color:var(--muted);font-size:13.5px}
.iualt b{font-family:var(--f-body);font-style:normal;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.opt{display:flex;gap:8px;align-items:center;padding:6px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px;min-height:60px;resize:vertical}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.foot .grow{margin-left:auto}
/* Lead */
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;margin-bottom:16px}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 8px;color:var(--ink);font-size:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:8px}
h3{font-size:13px;margin:0 0 8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.dis{background:var(--bad-soft)}
details{border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
summary{padding:8px 12px;cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details .tw{border:0;border-top:1px solid var(--line);border-radius:0}
/* Key */
.keyact{margin-bottom:18px}
.keyact h3{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-size:16px}
.gd{font-family:var(--f-mono);font-size:11px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:var(--r);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px}
.pre{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;max-height:240px;overflow:auto;background:var(--sunk);padding:8px;border-radius:var(--r)}
</style>

/* ---------- write queue: one write at a time per document ---------- */
const PW=new Map();
function queueWrite(path,data,delay=350){let p=PW.get(path);if(!p){p={};PW.set(path,p);}p.data=data;clearTimeout(p.t);p.t=setTimeout(()=>flush(path),delay);}
async function flush(path){const p=PW.get(path);if(!p)return;if(p.busy){p.again=true;return;}if(!p.data){PW.delete(path);return;}
  const data=p.data;p.data=null;p.busy=true;let ok=true;try{await DB.doc(path).set(data);}catch(e){ok=false;if(e.code==="unavailable"||e.code==="locked"){S.netErr=true;if(!p.data)p.data=data;if(e.code==="locked")toast(errMsg(e));}else toast(errMsg(e));render();}
  p.busy=false;if(!ok&&p.data){p.again=false;p.t=setTimeout(()=>flush(path),5000);return;}if(p.data||p.again){p.again=false;flush(path);}else PW.delete(path);}

/* ---------- local cache shared by both stores ---------- */
function makeStore(){const store=new Map(),subs=[];const par=p=>p.split("/").slice(0,-1).join("/");
  const snap=p=>({id:p.split("/").pop(),exists:store.has(p),data:()=>store.get(p)});
  const notify=()=>subs.slice().forEach(s=>s.fire());
  const collection=cp=>({onSnapshot(next){const s={fire:()=>{const docs=[...store.keys()].filter(k=>par(k)===cp).sort().map(snap);next({docs,size:docs.length,empty:!docs.length});}};subs.push(s);setTimeout(s.fire,0);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1);};}});
  return{store,notify,collection};}
/* demo: in memory, nothing saved */
function memDB(){const c=makeStore();const apply=ops=>{ops.forEach(o=>o.op==="delete"?c.store.delete(o.path):c.store.set(o.path,clone(o.data)));setTimeout(c.notify,0);};
  return{store:c.store,collection:c.collection,doc:p=>({set:async d=>apply([{op:"set",path:p,data:d}]),delete:async()=>apply([{op:"delete",path:p}])}),batch:async ops=>apply(ops),setRole:async()=>{},start(){}};}
/* live: Google Sheet via Apps Script web app, polled every 15 s */
function remoteDB(api,key){const c=makeStore();let since=0,role=S.role,timer=null,chain=Promise.resolve();
  const fail=(code)=>Object.assign(new Error(code),{code});
  async function call(url,opt){let r,j;try{r=await fetch(url,opt);}catch(e){throw fail("unavailable");}try{j=await r.json();}catch(e){throw fail("unavailable");}if(!j.ok)throw fail(j.error||"unavailable");return j;}
  async function doPull(full){if(full)since=0;
    const j=await call(api,{method:"POST",body:JSON.stringify({action:"pull",key,role,since})});let changed=!!full;
    if(full){const seen=new Set(j.docs.map(d=>d.path));[...c.store.keys()].forEach(k=>{if(!seen.has(k)){c.store.delete(k);changed=true;}});}
    j.docs.forEach(d=>{const cur=c.store.get(d.path);if(d.data==null){if(cur!==undefined){c.store.delete(d.path);changed=true;}}
      else if(JSON.stringify(cur)!==JSON.stringify(d.data)){c.store.set(d.path,d.data);changed=true;}if(d.t>since)since=d.t;});
    if(S.netErr){S.netErr=false;changed=true;}if(changed)c.notify();return j;}
  const pull=full=>{const p=chain.then(()=>doPull(full));chain=p.catch(()=>{});return p;};
  async function write(ops){ops.forEach(o=>o.op==="delete"?c.store.delete(o.path):c.store.set(o.path,clone(o.data)));setTimeout(c.notify,0);
    await call(api,{method:"POST",body:JSON.stringify({action:"write",key,role,ops})});}
  return{store:c.store,collection:c.collection,pull,
    doc:p=>({set:d=>write([{op:"set",path:p,data:clone(d)}]),delete:()=>write([{op:"delete",path:p}])}),
    batch:ops=>write(ops),
    setRole:r=>{role=r;return pull(true);},
    start(){clearInterval(timer);const tick=()=>{if(!document.hidden)pull().catch(()=>{S.netErr=true;render();});};timer=setInterval(tick,15000);document.addEventListener("visibilitychange",tick);}};}

}

function renderCoder(id){

  const units=unitsOf(id);const d=myDoc(id)||{phase:"act",items:{}};const ph=d.phase;

function renderActPass(id,units,d){

function codeLabel(it){if(!it||!it.act)return"(blank)";if(!isAct(it.act))return ACT_NAME(it.act);if(it.none)return"A"+it.act+": no match";return(it.ius||[]).slice().sort((a,b)=>a-b).map(n=>"#"+n).join(" + ")||"(blank)";}
function kappa(pairs){const n=pairs.length;if(!n)return{po:null,k:null,n:0};const ca={},cb={},cats=new Set();let po=0;
  pairs.forEach(([a,b])=>{if(a===b)po++;ca[a]=(ca[a]||0)+1;cb[b]=(cb[b]||0)+1;cats.add(a);cats.add(b);});po/=n;let pe=0;cats.forEach(c=>pe+=((ca[c]||0)/n)*((cb[c]||0)/n));
  return{po,k:pe>=1?(po===1?1:0):(po-pe)/(1-pe),n};}
function relData(){const L=latestCodes();const per=[];let pending=0;
  respList().forEach(r=>{const c=L[r.id]||{};const A=c.C1,B=c.C2;if(!A||!B){if((r.assign||"both")==="both"&&(A||B))pending++;return;}
    if(A.phase!=="done"||B.phase!=="done"){pending++;return;}
    const units=unitsOf(r.id);const rows=units.map((u,i)=>{const a=A.items[u.key],b=B.items[u.key];return{i,u,a,b,actA:a?.act1||a?.act||"-",actB:b?.act1||b?.act||"-",ideaA:codeLabel(a),ideaB:codeLabel(b)};});
    per.push({r,A,B,rows,act:kappa(rows.map(x=>[x.actA,x.actB])),idea:kappa(rows.map(x=>[x.ideaA,x.ideaB]))});});
  const all=per.flatMap(p=>p.rows);return{per,pending,act:kappa(all.map(x=>[x.actA,x.actB])),idea:kappa(all.map(x=>[x.ideaA,x.ideaB]))};}
function meets(s){return s.n&&(s.po>=.8||s.k>.6);}
function renderRel(){const R=relData();
  const tile=(k,s)=>`<div class="stat"><div class="k">${k}</div><div class="v">${pct(s.po)}</div><div class="s">κ = ${k2(s.k)} · ${s.n} units ${s.n?`<span class="chip ${meets(s)?"ok":"mid"}">${meets(s)?"Meets criterion":"Below criterion"}</span>`:""}</div></div>`;
  const det=R.per.map(p=>{const dis=p.rows.filter(x=>x.actA!==x.actB||x.ideaA!==x.ideaB);
    return`<details><summary><span class="mono" style="font-family:var(--f-mono)">${h(p.r.pid)} · S${h(p.r.session||"?")}</span><span class="chip">Act ${pct(p.act.po)}</span><span class="chip">Idea unit ${pct(p.idea.po)}</span><span class="meta">${dis.length} disagreement${dis.length===1?"":"s"} · ${h(p.A.initials||"C1")} vs ${h(p.B.initials||"C2")}</span></summary>
    <div class="tw"><table><thead><tr><th>#</th><th>Unit</th><th>Coder 1</th><th>Coder 2</th></tr></thead><tbody>${p.rows.map(x=>{const da=x.actA!==x.actB,di=x.ideaA!==x.ideaB;
      return`<tr><td class="mono">${x.i+1}</td><td>${h(x.u.text)}</td><td class="${da||di?"dis":""}">${h(ACT_NAME(x.actA))}<br><span class="meta">${h(x.ideaA)}</span>${x.a?.note?`<br><i>${h(x.a.note)}</i>`:""}</td><td class="${da||di?"dis":""}">${h(ACT_NAME(x.actB))}<br><span class="meta">${h(x.ideaB)}</span>${x.b?.note?`<br><i>${h(x.b.note)}</i>`:""}</td></tr>`;}).join("")}</tbody></table></div></details>`;}).join("");
  return`<p class="hint">Agreement between Coder 1 and Coder 2 on responses both have submitted. Act agreement uses each coder's locked pass-1 Act. Idea-unit agreement compares the full code for each unit (the set of idea units, “no match”, Not in story or Unclear). Criterion from the preregistration: 80% agreement or κ &gt; .60.</p>
  <div class="stats">${tile("Act agreement",R.act)}${tile("Idea-unit agreement",R.idea)}<div class="stat"><div class="k">Responses compared</div><div class="v">${R.per.length}</div><div class="s">${R.pending} still in progress</div></div></div>
  ${det||`<div class="empty"><strong>Nothing to compare yet</strong>Agreement appears once both coders submit the same response.</div>`}`;
}

const csvq=v=>{const s=String(v??"");return/[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};

const sideKeyRole=()=>(S.role==="U"||S.role==="C1"||S.role==="C2")&&(S.mode==="live"||S.mode==="demo")&&S.view==="work";
function keyCtx(){const none={act:null,sel:[]};if(!(S.role==="C1"||S.role==="C2")||!S.sel||S.units[S.sel]?.status!=="final")return none;
  const units=unitsOf(S.sel);const d=myDoc(S.sel);if(!units.length)return none;
  if(!d||d.phase==="act"){const u=units[Math.min(S.curRow,units.length-1)];return{act:d?.items[u.key]?.act||null,sel:[]};}
  const u=units[Math.min(S.curUnit,units.length-1)];const it=d.items[u.key]||{};return{act:it.act||null,sel:it.ius||[]};}
const GUIDE=`<div class="guide">
<p class="glead">Split each response into <b>clause-level units</b>: one subject with one verb (the subject can be implied). This matches how the story itself is divided, so most recall units line up with one idea unit in the key.</p>
<h3>Split</h3>
<ul>
<li><b>Between clauses.</b> Split before joining words like <i>and, but, so, because, then, after, when, while, where, who, which</i> when a new verb follows.<div class="gex">She had forgotten her work in her locker <span class="gcut">‖</span> causing her to go back into the school <span class="gcut">‖</span> where she sees a custodian <span class="gcut">‖</span> who has headphones on</div></li>
<li><b>Time and place phrases get their own unit.</b> The story key separates these (for example #1 “It's late August”, #2 “in Silver City, New Mexico”, #85 “It was early March”).<div class="gex">Months later <span class="gcut">‖</span> she got a letter from NMSU</div></li>
<li><b>Comments that aren't story content</b> (“I think”, “I don't remember the rest”) get their own unit so coders can mark them <i>Not in story</i>.</li>
</ul>
<h3>Don't split</h3>
<ul>
<li><b>Dialogue.</b> Keep one quoted or paraphrased line of speech together, even if it has several clauses. The key keeps dialogue lines whole (#35, #37).<div class="gex">Chrissy said she never does well in her classes</div></li>
<li><b>A verb from what completes it.</b> <i>decided to pick up the test</i>, <i>wanted to get into NMSU</i> and <i>wondered whether to take it</i> are one unit each.</li>
<li><b>A run of actions in one moment by the same person.</b> The key keeps these together (#60 walked to her locker, put in her combination, and grabbed her notebook; #79 left the test and ran out the backdoor).</li>
<li><b>Names.</b> Leave a character's name inside its clause.</li>
</ul>
<h3>Also</h3>
<ul>
<li>Don't fix spelling or grammar. Unitize what the participant wrote.</li>
<li>A cut-off ending (“got a letter back in mar”) is its own unit.</li>
<li><b>When unsure, split.</b> Coders can match one unit to two story units, but they can't divide a unit that's too big.</li>
</ul></div>`;
function renderSideKey(){const sk=$("#sidekey"),shell=$("#shell");
  const show=S.popout||(S.keyOpen&&sideKeyRole());sk.hidden=!show;shell.classList.toggle("withkey",show&&!S.popout);
  if(!show)return;
  const isU=S.role==="U"&&!S.popout;const tab=isU?S.skTab:"key";const kind=isU?"U":"C";
  if(sk.dataset.built!==kind){sk.dataset.built=kind;sk.dataset.sig="";
    sk.innerHTML=`<div class="skhead"><div class="row">${isU?`<div class="tabs sktabs" role="tablist"><button role="tab" data-k="tab" data-v="guide">Unitizing guide</button><button role="tab" data-k="tab" data-v="key">Story key</button></div>`:`<h2>Story key</h2>`}<span>${S.popout?"":`<button class="btn ghost" data-k="pop" title="Open the story key in its own window">Pop out</button> <button class="btn ghost" data-k="close" aria-label="Hide side panel">Hide</button>`}</span></div>
      <div class="skkeyhead"><input id="keyq" type="search" placeholder="Search words, e.g. custodian, letter, #62" aria-label="Search the story key"><div class="skchips"></div><div class="sknote"></div></div></div><div class="sklist"></div>`;}
  if(isU){sk.querySelectorAll(".sktabs [data-k=tab]").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===tab));}
  sk.querySelector(".skkeyhead").hidden=tab!=="key";const pop=sk.querySelector("[data-k=pop]");if(pop)pop.hidden=tab!=="key";
  if(tab==="guide"){if(sk.dataset.sig!=="guide"){sk.dataset.sig="guide";sk.dataset.act="";sk.querySelector(".sklist").innerHTML=GUIDE;sk.scrollTop=0;}return;}
  const ctx=keyCtx();
  if(isAct(ctx.act)&&ctx.act!==S.lastFollow){S.keyAct=ctx.act;}S.lastFollow=ctx.act;
  const sig=[S.keyAct,S.keyQ,ctx.sel.join(",")].join("|");if(sig===sk.dataset.sig)return;
  const actChanged=sk.dataset.act!==S.keyAct;sk.dataset.sig=sig;sk.dataset.act=S.keyAct;
  sk.querySelector(".skchips").innerHTML=["all","1","2","3","4","5","6"].map(a=>`<button class="kc ${a==="all"?"":"c"+a}" data-k="act" data-v="${a}" aria-pressed="${S.keyAct===a&&!S.keyQ}" title="${a==="all"?"All Acts":h(ACTS[a])}">${a==="all"?"All":"Act "+a}</button>`).join("");
  const q=S.keyQ.trim().toLowerCase().replace(/^#/,"");
  const rows=K.filter(r=>q?(String(r[0])===q||(r[2]+" "+r[3]+" "+(r[4]||"")).toLowerCase().includes(q)):(S.keyAct==="all"||String(r[1])===S.keyAct));
  sk.querySelector(".sknote").textContent=q?`${rows.length} match${rows.length===1?"":"es"} across all Acts`:S.keyAct==="all"?"All 96 idea units":ACTS[S.keyAct]+(isAct(ctx.act)&&ctx.act===S.keyAct?" · follows the current unit":"");
  let html="",last=0;
  rows.forEach(r=>{if(r[1]!==last){last=r[1];html+=`<div class="skact"><span class="actchip c${r[1]}">Act ${r[1]}</span>${h(ACTS[r[1]])}</div>`;}
    html+=`<div class="ski c${r[1]} ${ctx.sel.includes(r[0])?"on":""}"><span class="iun">#${r[0]}</span><span><span class="iul">${h(r[2])}</span><span class="iut">${h(r[3])}</span>${r[4]?`<span class="iualt"><b>Other version</b> ${h(r[4])}</span>`:""}</span></div>`;});
  const st=sk.scrollTop;sk.querySelector(".sklist").innerHTML=html||`<p class="sknote">No idea units match “${h(S.keyQ)}”.</p>`;
  sk.scrollTop=actChanged?0:st;}
$("#sidekey").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;
  if(b.dataset.k==="tab"){S.skTab=b.dataset.v;ls("skTab",S.skTab);renderSideKey();return;}
  if(b.dataset.k==="act"){S.keyAct=b.dataset.v;S.keyQ="";const qi=$("#keyq");if(qi)qi.value="";renderSideKey();}
  else if(b.dataset.k==="close"){S.keyOpen=false;ls("keyOpen","0");render();}
  else if(b.dataset.k==="pop"){const w=window.open(location.href.split("#")[0]+"#key","amelia_story_key","width=560,height=880");if(!w)toast("Your browser blocked the new window. Allow pop-ups for this page and try again.");}});
$("#sidekey").addEventListener("input",e=>{if(e.target.id==="keyq"){S.keyQ=e.target.value;renderSideKey();}});

/* ---------- login ---------- */
function renderLogin(){const busy=S.mode==="connecting";
  return`<form class="panel login" id="loginForm"><div><h2 style="font-family:var(--f-display);margin:0 0 4px">Sign in to code</h2><p class="hint" style="margin:0">Enter the passcode from the study lead. Coders and the unitizer share one passcode; the lead has their own.</p></div>
  ${API_URL?"":`<label class="field" for="l_api">Web app URL<input id="l_api" value="${h(ls("api")||"")}" placeholder="https://script.google.com/macros/s/…/exec" required></label>`}
  <label class="field" for="l_key">Passcode<input id="l_key" type="password" autocomplete="current-password" required></label>
  ${S.loginErr?`<p class="err">${h(S.loginErr)}</p>`:""}
  <div class="row"><button class="btn primary" type="submit" ${busy?"disabled":""}>${busy?"Connecting…":"Open the coding sheet"}</button><button class="btn ghost" type="button" data-a="demo">Try the demo</button></div></form>`;}

/* ---------- key ---------- */
function renderKey(){const showGD=S.role==="L";
  return`<section class="panel"><div class="ph"><h2>Story key</h2><span class="meta">96 idea units · 6 Acts</span></div><p class="hint">The master idea-unit list from the coding manual. Where a unit differs by condition, both versions are shown; either version counts as the same idea unit.</p>
  ${[1,2,3,4,5,6].map(a=>`<div class="keyact"><h3><span class="actchip c${a}">Act ${a}</span>${h(ACTS[a])}</h3><div class="tw"><table><thead><tr><th>#</th><th>Idea unit</th><th>Story text</th>${showGD?"<th>Draft code</th>":""}</tr></thead><tbody>
  ${K.filter(r=>r[1]===a).map(r=>`<tr><td class="mono">${r[0]}</td><td>${h(r[2])}</td><td style="font-family:var(--f-display)">${h(r[3])}${r[4]?`<br><i style="color:var(--muted)">Other version: ${h(r[4])}</i>`:""}</td>${showGD?`<td class="gd">${r[5]==="G"?"Gist":"Detail"}</td>`:""}</tr>`).join("")}</tbody></table></div></div>`).join("")}</section>`;}

/* ---------- actions ---------- */
function setUnits(id,bounds,status){if(!S.uid){toast("Sign in to save.");return;}const d={bounds:[...new Set(bounds)].sort((a,b)=>a-b),status,by:S.uid,initials:S.initials,updatedAt:Date.now()};S.units[id]=d;queueWrite("units/"+id,clone(d),250);render();}
function setAct(key,v,i){const d=ensureDoc(S.sel);if(d.phase!=="act")return;item(d,key).act=v;saveDoc(S.sel);const units=unitsOf(S.sel);
  let nx=units.findIndex((u,j)=>j>i&&!d.items[u.key]?.act);if(nx<0)nx=Math.min(i+1,units.length-1);S.curRow=nx;render();
  const el=document.querySelector(".arow.cur");if(el&&el.scrollIntoView)el.scrollIntoView({block:"nearest"});}
function sanitize(s){return String(s||"").trim().replace(/[^A-Za-z0-9_\-.~:@+]/g,"-").replace(/^\.+$/,"x").slice(0,80)||"resp";}
function makeResp(pid,session,condition,text,i){pid=String(pid||"").trim();text=String(text||"").trim();if(!pid||!text)return null;
  let id=sanitize(pid+"_s"+(session||"1"));let k=2;while(S.responses[id])id=sanitize(pid+"_s"+(session||"1"))+"-"+(k++);
  const doc={pid,session:String(session||"1"),condition:condition||"",text,assign:"both",createdAt:Date.now()+(i||0)};S.responses[id]=doc;return{id,doc};}
async function addResponse(pid,session,condition,text){const r=makeResp(pid,session,condition,text);if(!r)return false;
  try{await DB.doc("responses/"+r.id).set(r.doc);return true;}catch(e){delete S.responses[r.id];toast(errMsg(e));return false;}}
async function batched(ops){for(let i=0;i<ops.length;i+=50)await DB.batch(ops.slice(i,i+50));}
function parseRows(txt){const tab=txt.includes("\t");const rows=[];
  if(tab)txt.split(/\r?\n/).forEach(l=>{if(l.trim())rows.push(l.split("\t"));});
  else{let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===","){row.push(f);f="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[];}else f+=c;}
    row.push(f);if(row.some(x=>x.trim()))rows.push(row);}
  if(!rows.length)return[];const hd=rows[0].map(x=>x.trim().toLowerCase());const ix=n=>hd.findIndex(x=>n.some(m=>x===m||x.includes(m)));
  let ip=ix(["pid","participant"]),is=ix(["session"]),ic=ix(["condition"]),it=ix(["text","response","recall"]);let body=rows;
  if(it>=0)body=rows.slice(1);else{const w=rows[0].length;ip=w>1?0:-1;is=w>2?1:-1;ic=w>3?2:-1;it=w-1;}
  return body.map((r,i)=>({pid:ip>=0?r[ip]:"P"+String(i+1).padStart(3,"0"),session:is>=0?(r[is]||"1").trim():"1",condition:ic>=0?(r[ic]||"").trim():"",text:r[it]||""})).filter(r=>r.text.trim());}

document.addEventListener("click",async e=>{
  const rb=e.target.closest("[data-role]");if(rb){if(rb.dataset.role==="L"&&S.mode==="live"&&!S.canLead){toast("Lead tools need the lead passcode.");return;}S.role=rb.dataset.role;if(DB&&S.mode==="live")DB.setRole(S.role).catch(()=>{});ls("role",S.role);S.view="work";S.sel=null;S.curRow=0;S.curUnit=0;registerCoder();render();return;}
  if(e.target.closest("#lockBtn")){ls("key","");location.reload();return;}
  if(e.target.closest("#keyBtn")){if(sideKeyRole()){S.keyOpen=!S.keyOpen;ls("keyOpen",S.keyOpen?"1":"0");}else S.view=S.view==="key"?"work":"key";render();return;}
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;const id=S.sel;
  if(el.tagName==="INPUT"||el.tagName==="SELECT"||el.tagName==="TEXTAREA")return;
  switch(a){
    case"demo":startDemo();break;
    case"sel":S.sel=el.dataset.id;S.curRow=0;S.curUnit=0;render();window.scrollTo({top:0});break;
    case"tog":{const u=S.units[id];if(u?.status==="final")return;const i=+el.dataset.i;const b=new Set(u?.bounds||[]);b.has(i)?b.delete(i):b.add(i);setUnits(id,[...b],"draft");break;}
    case"clear":setUnits(id,[],"draft");break;
    case"final":setUnits(id,S.units[id]?.bounds||[],"final");toast("Unitizing marked complete. Coders can start.");break;
    case"reopen":setUnits(id,S.units[id]?.bounds||[],"draft");break;
    case"row":S.curRow=+el.dataset.i;render();break;
    case"act":setAct(el.dataset.k,el.dataset.v,+el.dataset.i);break;
    case"toUnit":{const d=ensureDoc(id);unitsOf(id).forEach(u=>{const it=item(d,u.key);it.act1=it.act;});d.phase="unit";S.curUnit=Math.max(0,unitsOf(id).findIndex(u=>!unitDone(d.items[u.key])));saveDoc(id);render();break;}
    case"u":S.curUnit=+el.dataset.i;render();break;
    case"prev":S.curUnit=Math.max(0,S.curUnit-1);render();break;
    case"next":S.curUnit++;render();break;
    case"submit":{const d=ensureDoc(id);d.phase="done";d.submittedAt=Date.now();saveDoc(id);toast("Response submitted.");render();break;}
    case"reopenC":{const d=ensureDoc(id);d.phase="unit";saveDoc(id);render();break;}
    case"ltab":S.leadTab=el.dataset.t;S.exportCsv=null;render();break;
    case"del":S.confirmDel=el.dataset.id;render();break;
    case"delNo":S.confirmDel=null;render();break;
    case"delYes":{const rid=el.dataset.id;S.confirmDel=null;try{await DB.batch([{op:"delete",path:"responses/"+rid},...(S.units[rid]?[{op:"delete",path:"units/"+rid}]:[])]);toast("Response deleted.");}catch(err){toast(errMsg(err));}break;}
    case"bulk":{const rows=parseRows($("#f_bulk").value);const made=rows.map((r,i)=>makeResp(r.pid,r.session,r.condition,r.text,i)).filter(Boolean);
      try{await batched(made.map(m=>({op:"set",path:"responses/"+m.id,data:m.doc})));S.bulkMsg=rows.length?`Added ${made.length} of ${rows.length} rows.`:"No rows with text found.";if(made.length)$("#f_bulk").value="";}
      catch(err){made.forEach(m=>delete S.responses[m.id]);S.bulkMsg="Nothing was added: "+errMsg(err);}render();break;}
    case"rel20":{const list=respList();const sh=list.map(r=>r.id).sort(()=>Math.random()-.5);const nb=Math.max(1,Math.ceil(list.length*.2));const ops=[];
      sh.forEach((rid,i)=>{const as=i<nb?"both":(i%2?"C1":"C2");const r=S.responses[rid];if(r.assign!==as)ops.push({op:"set",path:"responses/"+rid,data:{...clone(r),assign:as}});});
      try{await batched(ops);toast(`${nb} double-coded; the rest alternate between coders.`);}catch(err){toast(errMsg(err));}render();break;}
    case"exp":{const csv=buildCsv(el.dataset.t);const fn=(el.dataset.t==="units"?"amelia_recall_units":"amelia_recall_scores")+".csv";
      const link=document.createElement("a");link.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));link.download=fn;document.body.appendChild(link);link.click();
      setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove();},1500);break;}
    case"copy":{const t=$("#exptxt");try{await navigator.clipboard.writeText(t.value);toast("Copied.");}catch(err){t.select();toast("Selected. Press Ctrl/Cmd+C to copy.");}break;}
  }
});
document.addEventListener("change",e=>{const el=e.target;const a=el.dataset&&el.dataset.a;if(!a)return;const id=S.sel;
  if(a==="iu"){const d=ensureDoc(id);const it=item(d,el.dataset.k);const n=+el.dataset.n;it.ius=(it.ius||[]).filter(x=>x!==n);if(el.checked)it.ius.push(n);saveDoc(id);render();}
  else if(a==="none"){const d=ensureDoc(id);const it=item(d,el.dataset.k);it.none=el.checked;if(el.checked)it.ius=[];saveDoc(id);render();}
  else if(a==="flag"){const d=ensureDoc(id);item(d,el.dataset.k).flag=el.checked;saveDoc(id);}
  else if(a==="chAct"){const d=ensureDoc(id);const it=item(d,el.dataset.k);if(it.act!==el.value){it.act=el.value;it.ius=[];it.none=false;saveDoc(id);render();}}
  else if(a==="assign"){const rid=el.dataset.id;const r=S.responses[rid];r.assign=el.value;DB.doc("responses/"+rid).set(clone(r)).catch(err=>toast(errMsg(err)));}
});
document.addEventListener("input",e=>{const el=e.target;
  if(el.id==="initials"){S.initials=el.value.toUpperCase().replace(/[^A-Z0-9]/g,"");ls("ini",S.initials);clearTimeout(render.t);render.t=setTimeout(()=>{registerCoder();render();},500);return;}
  if(el.dataset&&el.dataset.a==="note"){const d=ensureDoc(S.sel);item(d,el.dataset.k).note=el.value;saveDoc(S.sel);}
});
document.addEventListener("submit",async e=>{if(e.target.id==="loginForm"){e.preventDefault();connect((API_URL||$("#l_api").value).trim(),$("#l_key").value.trim());return;}
  if(e.target.id!=="addOne")return;e.preventDefault();
  const ok=await addResponse($("#f_pid").value,$("#f_ses").value,$("#f_con").value,$("#f_txt").value);if(ok){$("#f_pid").value="";$("#f_txt").value="";$("#f_con").value="";toast("Response added.");render();}});
document.addEventListener("keydown",e=>{
  const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(t&&t.classList&&t.classList.contains("w")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();return;}
  if(S.view!=="work"||!(S.role==="C1"||S.role==="C2")||!S.sel)return;
  const d=myDoc(S.sel);if(S.units[S.sel]?.status!=="final")return;const units=unitsOf(S.sel);
  if(!d||d.phase==="act"){const k=e.key.toUpperCase();
    if(/^[1-6]$/.test(k)||k==="N"||k==="U"){e.preventDefault();const u=units[S.curRow];if(u)setAct(u.key,k,S.curRow);}
    else if(e.key==="ArrowDown"||k==="J"){e.preventDefault();S.curRow=Math.min(units.length-1,S.curRow+1);render();document.querySelector(".arow.cur")?.scrollIntoView({block:"nearest"});}
    else if(e.key==="ArrowUp"||k==="K"){e.preventDefault();S.curRow=Math.max(0,S.curRow-1);render();document.querySelector(".arow.cur")?.scrollIntoView({block:"nearest"});}}
  else if(d.phase==="unit"){if(e.key==="ArrowRight"){S.curUnit=Math.min(units.length-1,S.curUnit+1);render();}else if(e.key==="ArrowLeft"){S.curUnit=Math.max(0,S.curUnit-1);render();}}
});
boot();
</script>
